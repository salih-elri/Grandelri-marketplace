<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart — VITTAGO</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👑</text></svg>">
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar">
    <div class="container nav-inner">
      <a href="/index.html" class="nav-logo">
        <div class="logo-mark" style="font-family: serif; letter-spacing: -2px;">VG</div>
        <div class="logo-text-wrap">
          <span class="logo-name">VITTAGO</span>
          <span class="logo-stars">★★★★★</span>
        </div>
      </a>
      <ul class="nav-links">
        <li><a href="/index.html" class="filter-tab">Home</a></li>
      </ul>
      <div class="nav-auth" id="nav-auth"></div>
    </div>
  </nav>

  <!-- Auth Modal -->
  <div class="modal-overlay" id="auth-modal">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title">Welcome</h2>
        <button class="modal-close" id="modal-close">×</button>
      </div>
      <div id="forgot-form-wrap" class="hidden">
        <p style="margin-bottom: 16px; font-size: 0.9rem; color: var(--text-secondary);">Enter your email address and we'll send you a link to reset your password.</p>
        <form id="forgot-form" class="modal-form">
          <div class="form-group">
            <label class="form-label" for="forgot-email">Email</label>
            <input type="email" id="forgot-email" class="form-input" required>
          </div>
          <div class="error-msg" id="forgot-error" style="color: var(--success);"></div>
          <button type="submit" class="btn btn-primary btn-lg mt-4 w-full">Send Reset Link</button>
        </form>
      </div>
    </div>
  </div>

  <main class="container page-wrapper" style="padding-top: 40px; padding-bottom: 80px;">
    <h1 style="margin-bottom: 24px; text-align: center; font-size: 2rem;">My Cart</h1>
    
    <div style="max-width: 1200px; width: 100%; margin: 0 auto; background: var(--bg-card); padding: 30px; border-radius: var(--radius-lg); border: 1px solid var(--border);">
        <h2 style="margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px;">Update Email</h2>
        <form id="email-form" style="margin-bottom: 40px;">
            <div class="form-group" style="margin-bottom: 15px;">
                <label class="form-label">New Email Address</label>
                <input type="email" id="settings-email" class="form-input" required>
            </div>
            <button type="submit" class="btn btn-primary w-full">Change Email</button>
        </form>

        <h2 style="margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px;">Update Password</h2>
        <form id="password-form">
            <div class="form-group" style="margin-bottom: 15px;">
                <label class="form-label">Old Password</label>
                <input type="password" id="settings-old-password" class="form-input" required>
            </div>
            <div class="form-group" style="margin-bottom: 15px;">
                <label class="form-label">New Password</label>
                <input type="password" id="settings-new-password" class="form-input" required minlength="6">
            </div>
            <div class="form-group" style="margin-bottom: 15px;">
                <label class="form-label">Confirm New Password</label>
                <input type="password" id="settings-confirm-password" class="form-input" required minlength="6">
            </div>
            <div id="password-error-container" style="display: none; align-items: center; justify-content: space-between; background: rgba(244,63,94,0.1); border: 1px solid rgba(244,63,94,0.2); padding: 10px; border-radius: var(--radius-sm); margin-bottom: 15px;">
                <span id="password-error-text" style="color: var(--danger); font-size: 0.9rem;"></span>
                <button type="button" id="forgot-pwd-btn" class="btn btn-ghost btn-sm" style="font-size: 0.8rem; padding: 4px 8px;">Forgot Password?</button>
            </div>
            <button type="submit" class="btn btn-primary w-full">Your Items</button>
        </form>
    </div>
  </main>

  <script src="/js/app.js"></script>
  <script src="/js/cart.js"></script>
</body>
</html>
