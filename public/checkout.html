<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout — VITTAGO</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <div class="container nav-inner">
      <a href="/index.html" class="nav-logo">
        <div class="logo-mark" style="font-family: serif; letter-spacing: -2px;">VG</div>
        <div class="logo-text-wrap">
          <span class="logo-name">VITTAGO</span>
          <span class="logo-stars">★★★★★</span>
        </div>
      </a>
      <ul class="nav-links">
        <li><a href="/index.html" class="filter-tab">Return to Shop</a></li>
      </ul>
      <div class="nav-auth" id="nav-auth"></div>
    </div>
  </nav>

  <main class="container page-wrapper" style="padding-top: 40px; padding-bottom: 80px;">
    <h1 class="gradient-text" style="margin-bottom: 10px; text-align: center; font-size: 2.5rem;">Checkout</h1>
    <p style="text-align: center; color: var(--text-secondary); margin-bottom: 40px;">Complete your premium purchase</p>
    
    <div style="max-width: 800px; width: 100%; margin: 0 auto; display: grid; gap: 30px;">
        
        <div class="card" style="padding: 30px;">
            <h2 style="color: var(--gold); border-bottom: 1px solid var(--border); padding-bottom: 15px; margin-bottom: 20px;">Shipping Information</h2>
            <form onsubmit="event.preventDefault(); showToast('Simulating payment...', 'info'); setTimeout(() => { window.location.href='/index.html?success=true' }, 2000);">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
                    <div class="form-group">
                        <label class="form-label">First Name</label>
                        <input type="text" class="form-input" required placeholder="John">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Last Name</label>
                        <input type="text" class="form-input" required placeholder="Doe">
                    </div>
                </div>
                <div class="form-group" style="margin-bottom: 20px;">
                    <label class="form-label">Address</label>
                    <input type="text" class="form-input" required placeholder="123 Luxury Avenue">
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px;">
                    <div class="form-group">
                        <label class="form-label">City</label>
                        <input type="text" class="form-input" required placeholder="New York">
                    </div>
                    <div class="form-group">
                        <label class="form-label">ZIP Code</label>
                        <input type="text" class="form-input" required placeholder="10001">
                    </div>
                </div>

                <h2 style="color: var(--gold); border-bottom: 1px solid var(--border); padding-bottom: 15px; margin-bottom: 20px;">Payment Information</h2>
                <div class="form-group" style="margin-bottom: 20px;">
                    <label class="form-label">Card Number</label>
                    <input type="text" class="form-input" required placeholder="XXXX-XXXX-XXXX-XXXX" pattern=".*" maxlength="19">
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px;">
                    <div class="form-group">
                        <label class="form-label">Expiry Date</label>
                        <input type="text" class="form-input" required placeholder="MM/YY" maxlength="5">
                    </div>
                    <div class="form-group">
                        <label class="form-label">CVV</label>
                        <input type="text" class="form-input" required placeholder="123" maxlength="4">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; font-size: 1.1rem; padding: 15px;">Pay Now</button>
            </form>
        </div>
    </div>
  </main>

  <script src="/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
        if (!isLoggedIn()) {
            window.location.href = '/index.html';
        }
    });
  </script>
</body>
</html>
