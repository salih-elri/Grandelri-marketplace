<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings — VITTAGO</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-inner container">
      <a href="/index.html" class="nav-logo">
        <div class="logo-mark">VG</div>
        <div class="logo-text-wrap">
          <div class="logo-name">VITTAGO</div>
          <div class="logo-tagline">Premium E-Commerce</div>
          <div class="logo-stars">★★★★★</div>
        </div>
      </a>
      <ul class="nav-links">
        <li><a href="/index.html">All Items</a></li>
        <li><a href="/index.html?category=Vinyls">Vinyls</a></li>
      </ul>
      <div class="nav-auth" id="nav-auth"></div>
    </div>
  </nav>

  <main class="page-wrapper container" style="padding-top: 40px; padding-bottom: 80px;">
    <div class="profile-header">
      <h1 class="gradient-text">Settings</h1>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 24px; max-width: 800px; margin: 0 auto;">
        <a href="/profile.html" class="card" style="padding: 30px; text-align: center; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center;">
            <span style="font-size: 3rem; margin-bottom: 10px;">👤</span>
            <h3 style="color: var(--text-primary);">Profile</h3>
            <p style="color: var(--text-secondary); font-size: 0.9rem; margin-top: 5px;">Edit bio and photo</p>
        </a>
        <a href="/security.html" class="card" style="padding: 30px; text-align: center; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center;">
            <span style="font-size: 3rem; margin-bottom: 10px;">🔒</span>
            <h3 style="color: var(--text-primary);">Security</h3>
            <p style="color: var(--text-secondary); font-size: 0.9rem; margin-top: 5px;">Change your password</p>
        </a>
        <a href="#" id="btn-logout-settings" class="card" style="padding: 30px; text-align: center; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; border-color: rgba(244, 63, 94, 0.3);">
            <span style="font-size: 3rem; margin-bottom: 10px;">🚪</span>
            <h3 style="color: var(--danger);">Sign Out</h3>
            <p style="color: var(--text-secondary); font-size: 0.9rem; margin-top: 5px;">Log out of your account</p>
        </a>
    </div>
  </main>

  <div id="auth-modal" class="modal-overlay"></div>
  <script src="/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('btn-logout-settings')?.addEventListener('click', (e) => {
            e.preventDefault();
            clearAuth();
            showToast('Signed out successfully.', 'info');
            setTimeout(() => window.location.href='/index.html', 600);
        });
    });
  </script>
</body>
</html>
