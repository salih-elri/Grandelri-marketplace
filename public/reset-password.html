<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - VITTAGO</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .reset-container {
      max-width: 400px;
      margin: 80px auto;
      padding: 32px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow-card);
    }
    .reset-title {
      font-size: 1.5rem;
      margin-bottom: 24px;
      text-align: center;
      color: var(--text-primary);
    }
    .reset-logo {
      display: flex;
      justify-content: center;
      margin-bottom: 24px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="reset-container">
    <div class="reset-logo">
      <a href="/index.html" class="nav-logo" style="justify-content: center; text-decoration: none;">
        <div class="logo-mark">G</div>
        <div class="logo-text-wrap">
          <span class="logo-name">VITTAGO</span>
        </div>
      </a>
    </div>
    
    <h2 class="reset-title">Reset Your Password</h2>
    
    <form id="reset-form" class="modal-form">
      <div class="form-group">
        <label class="form-label" for="new-password">New Password</label>
        <input type="password" id="new-password" class="form-input" required minlength="6">
      </div>
      <div class="form-group">
        <label class="form-label" for="confirm-password">Confirm New Password</label>
        <input type="password" id="confirm-password" class="form-input" required minlength="6">
      </div>
      <div class="error-msg" id="reset-error"></div>
      <button type="submit" class="btn btn-primary btn-lg mt-4 w-full">Update Password</button>
    </form>
    
    <div style="text-align: center; margin-top: 24px;">
      <a href="/index.html" class="text-sm" style="color: var(--text-muted);">Return to Home</a>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token');
      
      if (!token) {
        document.getElementById('reset-error').textContent = 'Invalid or missing reset token.';
        document.getElementById('reset-error').classList.add('visible');
        document.querySelector('button[type="submit"]').disabled = true;
      }

      const form = document.getElementById('reset-form');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const pwd = document.getElementById('new-password').value;
        const confirm = document.getElementById('confirm-password').value;
        const errEl = document.getElementById('reset-error');

        if (pwd !== confirm) {
          errEl.textContent = 'Passwords do not match.';
          errEl.classList.add('visible');
          return;
        }

        const btn = form.querySelector('button');
        btn.disabled = true;
        btn.textContent = 'Updating...';

        try {
          await api.post('/auth/reset-password', { token, new_password: pwd });
          errEl.style.color = 'var(--success)';
          errEl.textContent = 'Password updated successfully! Redirecting...';
          errEl.classList.add('visible');
          setTimeout(() => {
            window.location.href = '/index.html';
          }, 2000);
        } catch (err) {
          errEl.style.color = 'var(--danger)';
          errEl.textContent = err.message;
          errEl.classList.add('visible');
          btn.disabled = false;
          btn.textContent = 'Update Password';
        }
      });
    });
  </script>
</body>
</html>
