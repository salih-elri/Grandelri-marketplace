<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VITTAGO — Premium Item</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👑</text></svg>">
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar">
    <div class="container nav-inner">
      <a href="/index.html" class="nav-logo">
        <div class="logo-mark" style="font-family: serif; letter-spacing: -2px;">VG</div>
        <div class="logo-text-wrap">
          <span class="logo-name">VITTAGO</span>
          <span class="logo-stars">★★★★★</span>
        </div>
      </a>
      <ul class="nav-links">
        <li><a href="/index.html" class="filter-tab">← Back to Collection</a></li>
      </ul>
      <div class="nav-auth" id="nav-auth"></div>
    </div>
  </nav>

  <!-- Auth Modal -->
  <div class="modal-overlay" id="auth-modal">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title">Welcome</h2>
        <button class="modal-close" id="modal-close">×</button>
      </div>
      
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">Sign In</button>
        <button class="auth-tab" data-tab="signup">Sign Up</button>
      </div>

      <!-- Login Form -->
      <div id="login-form-wrap">
        <form id="login-form" class="modal-form">
          <div class="form-group">
            <label class="form-label" for="login-username">Username</label>
            <input type="text" id="login-username" class="form-input" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="login-password">Password</label>
            <input type="password" id="login-password" class="form-input" required>
          </div>
          <div class="error-msg" id="login-error"></div>
          <div style="text-align: right; margin-top: 8px; margin-bottom: 8px;">
            <a href="#" onclick="switchAuthTab('forgot'); return false;" class="text-sm" style="color: var(--text-muted);">Forgot Password?</a>
          </div>
          <button type="submit" class="btn btn-primary btn-lg mt-4 w-full">Sign In</button>
        </form>
      </div>

      <!-- Sign Up Form -->
      <div id="signup-form-wrap" class="hidden">
        <form id="signup-form" class="modal-form">
          <div class="form-group">
            <label class="form-label" for="signup-username">Username</label>
            <input type="text" id="signup-username" class="form-input" required minlength="3">
          </div>
          <div class="form-group">
            <label class="form-label" for="signup-email">Email</label>
            <input type="email" id="signup-email" class="form-input" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="signup-password">Password</label>
            <input type="password" id="signup-password" class="form-input" required minlength="6">
          </div>
          <div class="form-group">
            <label class="form-label" for="signup-confirm">Confirm Password</label>
            <input type="password" id="signup-confirm" class="form-input" required minlength="6">
          </div>
          <div class="error-msg" id="signup-error"></div>
          <button type="submit" class="btn btn-primary btn-lg mt-4 w-full">Create Account</button>
        </form>
      </div>

      <!-- Forgot Password Form -->
      <div id="forgot-form-wrap" class="hidden">
        <p style="margin-bottom: 16px; font-size: 0.9rem; color: var(--text-secondary);">Enter your email address and we'll send you a link to reset your password.</p>
        <form id="forgot-form" class="modal-form">
          <div class="form-group">
            <label class="form-label" for="forgot-email">Email</label>
            <input type="email" id="forgot-email" class="form-input" required>
          </div>
          <div class="error-msg" id="forgot-error" style="color: var(--success);"></div>
          <button type="submit" class="btn btn-primary btn-lg mt-4 w-full">Send Reset Link</button>
          <div style="text-align: center; margin-top: 16px;">
            <a href="#" onclick="switchAuthTab('login'); return false;" class="text-sm" style="color: var(--text-muted);">Back to Sign In</a>
          </div>
        </form>
      </div>

    </div>
  </div>

  <main class="container page-wrapper" style="padding-top: 40px; padding-bottom: 60px;">
    
    <div id="item-loading" class="empty-state">
      <div class="skeleton-card" style="border:none;">
        <div class="item-detail-grid">
          <div class="skeleton skeleton-image" style="border-radius:20px;"></div>
          <div style="display:flex; flex-direction:column; gap:20px;">
            <div class="skeleton skeleton-line skeleton-line-lg" style="height:40px;"></div>
            <div class="skeleton skeleton-line skeleton-line-sm" style="height:30px;"></div>
            <div class="skeleton skeleton-line skeleton-line-md"></div>
            <div class="skeleton skeleton-line skeleton-line-md"></div>
          </div>
        </div>
      </div>
    </div>

    <div id="item-detail" class="hidden"></div>
    <div id="reviews-section" class="reviews-section hidden"></div>

  </main>

  <footer>
    <div class="container">
      <div class="footer-logo">VITTAGO</div>
      <div class="footer-stars">★★★★★</div>
      <p class="footer-copy">© 2026 Vittago Premium Marketplace. All rights reserved.</p>
    </div>
  </footer>

  <script src="/js/app.js"></script>
  <script src="/js/item.js"></script>
</body>
</html>
